name: mola
services:
  app:
    build: .
    image: mola:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      TRUST_PROXY: 1
      ENABLE_DEMO: "false"
      TURN_URLS: ${TURN_URLS:?Set TURN_URLS in .env}
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
      OPS_TOKEN_FILE: /run/mola-secrets/ops-token
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?Set MAIL_ENCRYPTION_KEY in .env}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?Set a compatible HTTPS alert receiver in .env}
    expose:
      - "3001"
    volumes:
      - mola_data:/app/data
      - mola_ops_secrets:/run/mola-secrets
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  backups:
    extends: {file: ops/compose.services.yaml, service: backups}
  prometheus:
    extends: {file: ops/compose.services.yaml, service: prometheus}
  alertmanager:
    extends: {file: ops/compose.services.yaml, service: alertmanager}
  restic:
    extends: {file: ops/compose.services.yaml, service: restic}
  turn:
    image: coturn/coturn:4.17.2-r0@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e
    profiles: [turn]
    restart: unless-stopped
    entrypoint: [/bin/sh, /ops/turn-entrypoint.sh]
    environment:
      TURN_REALM: ${TURN_REALM:-}
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-}
      TURN_SECRET: ${TURN_SECRET:-}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "49160-49259:49160-49259/udp"
    volumes:
      - ./ops/turn-entrypoint.sh:/ops/turn-entrypoint.sh:ro
      - ${TURN_CERTS_PATH:-./secrets/turn}:/etc/coturn/certs:ro
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
volumes:
  mola_data:
  caddy_data:
  caddy_config:
  mola_ops_secrets:
  mola_backups:
  mola_backup_status:
  mola_prometheus:
  mola_alertmanager:
