<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#153d36" />
    <title>Bağlantı bekleniyor · Mola</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f7f9f4;
        color: #153d36;
        font:
          16px/1.65 system-ui,
          sans-serif;
      }
      main {
        max-width: 420px;
        padding: 40px 28px;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.8px;
        margin: 24px 0 12px;
      }
      p {
        color: #5e7164;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        background: #153d36;
        color: white;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #80a26d;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/mola-192.png" alt="Mola" />
      <h1>Bağlantını bekliyoruz.</h1>
      <p>
        İnternete bağlandığında sohbetlerine dönebilirsin. Bu cihazda çevrimdışı
        mesaj geçmişi tutulmaz.
      </p>
      <a href="/">Yeniden dene</a>
    </main>
  </body>
</html>
