name: Mola
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: tr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Mola:
    type: application
    platform: iOS
    sources:
      - path: Mola
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mola.mobile
        INFOPLIST_FILE: Mola/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  MolaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MolaTests]
    dependencies:
      - target: Mola
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mola.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mola:
    build:
      targets:
        Mola: all
    test:
      targets: [MolaTests]
      gatherCoverageData: true
    archive:
      config: Release
