global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: mola
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/mola-secrets/ops-token
    static_configs:
      - targets: [app:3001]
  - job_name: mola-backups
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/mola-secrets/ops-token
    static_configs:
      - targets: [backups:9101]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
